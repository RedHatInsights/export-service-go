name: ginkgo-test
on:
  push:
  pull_request:
    branches:
      - main
jobs:
  ginkgo:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: checkout project
      - name: run ginkgo
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -r --procs=1 \
          --compilers=0 --randomize-all --randomize-suites \
          --fail-on-pending --keep-going --cover \
          --coverprofile=cover.profile --race --trace \
          --json-report=report.json --timeout=5m
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cover.profile
