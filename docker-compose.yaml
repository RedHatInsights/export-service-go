version: '3'

services:
  export:
    container_name: export-server
    image: export
    build:
      context: .
    environment:
      - PGSQL_PORT=5432
      - PGSQL_HOSTNAME=export-db
      - DEBUG=true
      - OPEN_API_FILE_PATH=/var/tmp/openapi.json
      - OPEN_API_PRIVATE_PATH=/var/tmp/private.json
      - PSKS=testing-a-psk
      - KAFKA_BROKERS=kafka:29092
      - AWS_ACCESS_KEY=minio
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - PUBLIC_PORT=8000
      - METRICS_PORT=9090
      - MINIO_PORT=9099
      - PRIVATE_PORT=10010
    ports:
      - 8000:8000
      - 9090:9090
      - 9099:9099
      - 10010:10010

  db:
    container_name: export-db
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    privileged: true
    ports:
      - 5432:5432
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - log_statement=all

  s3:
    # MinIO no longer publishes images on Docker Hub, so this runs the moto S3 server.
    # moto keeps data in memory, so buckets and objects reset when the container restarts.
    image: motoserver/moto:latest
    ports:
      - 9099:5000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/moto-api/"]
      interval: 5s
      timeout: 5s
      retries: 12

  s3-createbucket:
    image: motoserver/moto:latest
    depends_on:
      s3:
        condition: service_healthy
    restart: on-failure
    # moto accepts unsigned requests, so a plain PUT creates the bucket and fails loudly if it can't.
    entrypoint: ["curl", "-fsS", "-X", "PUT", "http://s3:5000/exports-bucket"]

  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=32181
      - ZOOKEEPER_SERVER_ID=1

  kafka:
    container_name: kafka
    # Kafka 4 (cp-kafka 8.x, the current latest tag) dropped ZooKeeper, which this config uses
    image: confluentinc/cp-kafka:7.9.2
    ports:
      - 9092:9092
      - 29092:29092
    depends_on:
      - zookeeper
    environment:
      - KAFKA_ADVERTISED_LISTENERS=DOCKER://${KAFKA_QUEUE_HOST-kafka}:${KAFKA_QUEUE_PORT-29092},LOCALHOST://localhost:${KAFKA_QUEUE_PORT-9092}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=DOCKER:PLAINTEXT,LOCALHOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=DOCKER
      - KAFKA_BROKER_ID=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:32181
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
